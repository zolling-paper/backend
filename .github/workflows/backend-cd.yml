name: Backend CD Workflow

on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev" ]
  #test
  pull_request:
    branches: [ "dev" ]

jobs:
  Build:
    name: 🏗️ Build Jar and Upload Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: 🏗️ Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🏗️ Build with Gradle
        run: ./gradlew clean bootJar

      - name: 🐳 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: 🐳 Docker Image Build and Push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ secrets.DOCKER_IMAGE_NAME_DEV }}:${{ github.sha }}
          platforms: linux/x86

  Deploy:
    needs: Build
    name: 🚀 Deployment
    runs-on: [ self-hosted ]

    steps:
      - name: 🚀 Deployment
        run: |
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}
          docker stop ${{ secrets.DOCKER_CONTAINER_NAME }} | true
          docker rm ${{ secrets.DOCKER_CONTAINER_NAME }} | true
          docker image prune -a -f
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME_DEV }}:${ github.sha }
          docker run --name ${{ secrets.DOCKER_CONTAINER_NAME }} -d -p 80:8080 -v /logs:/logs ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME_DEV }}:${ github.sha }
