name: Backend CI Workflow

on:
  push:
    branches: [ "main", "dev" ]
  #test
  pull_request:
    branches: [ "dev" ]

jobs:
  Backend_CI:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test with Gradle
        id: gradle_test
        run: |
          cd backend
          ./gradlew test
