swagger:
  hosts:
    - http://localhost:8080
    - https://api.zolling.me

spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:database;
    driver-class-name: org.h2.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

jwt:
  secret-key: ${JWT_SECRET_KEY}
  expire-time: ${JWT_EXPIRE_TIME}
